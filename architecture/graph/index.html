<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tony Football Architecture Graph</title><style>
:root{--b:#0b1020;--p:#131d34;--n:#192642;--t:#eef3ff;--m:#9eaccb;--l:#60729a;--a:#7fa9ff;--g:#f2c45e}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}header,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:13px 18px;background:#0e1629;border-bottom:1px solid #273454}h1{font-size:18px;margin:0}header p{color:var(--m);margin:2px 0}.controls{margin-left:auto}input,select,button{background:var(--p);color:var(--t);border:1px solid #3a4a70;border-radius:8px;padding:7px}button.active{border-color:var(--a)}main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 110px)}#v{overflow:auto}svg{min-width:1800px;min-height:1000px}aside{background:var(--p);border-left:1px solid #273454;padding:16px}.node rect{fill:var(--n);stroke:#61749e}.node.bridge rect{stroke:var(--g);stroke-width:2.4}.node.selected rect{stroke:var(--a);stroke-width:3}.node text{fill:var(--t)}.node .layer{fill:var(--m);font-size:10px}.edge{fill:none;stroke:var(--l);marker-end:url(#a)}.edge.hot{stroke:var(--a);stroke-width:2.5}.label{fill:#b7c2dd;font-size:9px}.dim{opacity:.08}.tag{display:inline-block;border:1px solid #45577f;border-radius:99px;padding:3px 7px;margin:2px;color:var(--m)}code{color:#cad8ff;overflow-wrap:anywhere}@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}}
</style></head><body><header><div><h1>Tony Football Architecture Graph</h1><p>Runtime authority, presentation flow, tests and migration bridges</p></div><div class="controls"><input id="q" placeholder="Tìm node…"> <select id="et"><option value="">Mọi edge</option></select> <button id="focus">Focus 1-hop</button> <button id="reset">Reset</button></div></header><div class="filters" id="filters"></div><main><div id="v"><svg id="s" viewBox="0 0 1800 1000"></svg></div><aside><h2 id="title">Chọn một node</h2><div id="info"><p>Click node để xem owner, source và migration issue.</p></div><p><span class="tag">Viền vàng</span> migration bridge.</p><p>Planning: Linear. Human map: <code>docs/11_SOURCE_MAP.md</code>.</p></aside></main><script type="module">
const G=await fetch('./graph.json').then(r=>r.json()),S=document.querySelector('#s'),NS='http://www.w3.org/2000/svg',by=Object.fromEntries(G.nodes.map(n=>[n.id,n])),layers=new Set(Object.entries(G.summary.layerCounts).filter(x=>x[1]).map(x=>x[0]));let selected=null,focus=false;const E=(n,a={})=>{const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e},defs=E('defs'),m=E('marker',{id:'a',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});m.append(E('path',{d:'M0 0L10 5L0 10z',fill:'#60729a'}));defs.append(m);S.append(defs);const eg=E('g'),ng=E('g');S.append(eg,ng);const order=['browser','application','input','core','engine','presentation','tests','tooling'],groups=new Map(),pos={};for(const n of G.nodes){if(!groups.has(n.layer))groups.set(n.layer,[]);groups.get(n.layer).push(n)}for(const[l,a]of groups){a.sort((x,y)=>x.label.localeCompare(y.label));a.forEach((n,i)=>pos[n.id]={x:25+Math.max(0,order.indexOf(l))*220,y:50+i*70})}const center=id=>[pos[id].x+88,pos[id].y+25];for(const e of G.edges){const[a,b]=center(e.from),[d,f]=center(e.to),mid=(a+d)/2,p=E('path',{class:'edge',d:`M${a} ${b}C${mid} ${b},${mid} ${f},${d} ${f}`,'data-f':e.from,'data-t':e.to,'data-k':e.type}),l=E('text',{class:'label',x:mid,y:(b+f)/2-3,'text-anchor':'middle','data-f':e.from,'data-t':e.to,'data-k':e.type});l.textContent=e.type;eg.append(p,l)}for(const n of G.nodes){const p=pos[n.id],g=E('g',{class:`node${n.bridge?' bridge':''}`,transform:`translate(${p.x},${p.y})`,'data-id':n.id});g.append(E('rect',{width:176,height:50,rx:9}));const t=E('text',{x:9,y:20});t.textContent=n.label.length>24?n.label.slice(0,22)+'…':n.label;const l=E('text',{class:'layer',x:9,y:38});l.textContent=n.layer;g.append(t,l);g.onclick=()=>pick(n.id);ng.append(g)}const et=document.querySelector('#et');for(const k of[...new Set(G.edges.map(e=>e.type))].sort()){const o=document.createElement('option');o.value=o.textContent=k;et.append(o)}const fb=document.querySelector('#filters');for(const l of layers){const b=document.createElement('button');b.textContent=l;b.className='active';b.onclick=()=>{layers.has(l)?layers.delete(l):layers.add(l);b.classList.toggle('active');draw()};fb.append(b)}
function pick(id){selected=id;const n=by[id];document.querySelector('#title').textContent=n.label;document.querySelector('#info').innerHTML=`<span class="tag">${n.layer}</span>${n.bridge?'<span class="tag">migration bridge</span>':''}<p><b>Owner:</b> ${n.owner}</p><p>${n.role}</p><p><b>Source:</b><br><code>${n.source}</code></p>${n.bridge?`<p><b>Removal:</b> ${n.bridge.issue} — ${n.bridge.reason}</p>`:''}`;history.replaceState(null,'',`?focus=${encodeURIComponent(id)}`);draw()}
function draw(){const q=document.querySelector('#q').value.toLowerCase(),k=et.value,near=new Set([selected]);if(selected)for(const e of G.edges){if(e.from===selected)near.add(e.to);if(e.to===selected)near.add(e.from)}document.querySelectorAll('.node').forEach(g=>{const n=by[g.dataset.id],ok=layers.has(n.layer)&&(!q||(n.label+n.source+n.owner+n.role).toLowerCase().includes(q))&&(!focus||!selected||near.has(n.id));g.classList.toggle('dim',!ok);g.classList.toggle('selected',n.id===selected)});document.querySelectorAll('.edge').forEach(p=>{const ok=layers.has(by[p.dataset.f].layer)&&layers.has(by[p.dataset.t].layer)&&(!k||p.dataset.k===k)&&(!focus||!selected||(near.has(p.dataset.f)&&near.has(p.dataset.t)));p.classList.toggle('dim',!ok);p.classList.toggle('hot',selected&&(p.dataset.f===selected||p.dataset.t===selected))});document.querySelectorAll('.label').forEach(l=>{const p=[...document.querySelectorAll('.edge')].find(x=>x.dataset.f===l.dataset.f&&x.dataset.t===l.dataset.t&&x.dataset.k===l.dataset.k);l.classList.toggle('dim',p.classList.contains('dim'))})}document.querySelector('#q').oninput=draw;et.onchange=draw;document.querySelector('#focus').onclick=()=>{focus=!focus;document.querySelector('#focus').classList.toggle('active',focus);draw()};document.querySelector('#reset').onclick=()=>location.href=location.pathname;const initial=new URLSearchParams(location.search).get('focus');initial&&by[initial]?pick(initial):draw();
</script></body></html>
