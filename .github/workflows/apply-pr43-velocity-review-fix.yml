name: Apply PR 43 velocity review fix

on:
  push:
    branches:
      - feature/r1-engine-boundary

permissions:
  contents: write

jobs:
  apply:
    name: Apply locally validated velocity patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove transport workflow
        shell: bash
        env:
          PATCH_GZIP_BASE64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/pr43-velocity-fix.patch
          git apply --check /tmp/pr43-velocity-fix.patch
          git apply /tmp/pr43-velocity-fix.patch
          rm -f .github/workflows/apply-pr43-velocity-review-fix.yml
          git config user.name "Tony Dev"
          git config user.email "tony-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(events): publish final kick velocity"
          git push origin HEAD:feature/r1-engine-boundary
