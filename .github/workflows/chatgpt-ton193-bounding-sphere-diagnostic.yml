name: ChatGPT TON-193 Bounding Sphere Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-ton193-bounding-sphere-diagnostic.yml
      - .github/temporary/ton193-bounding-sphere-diagnostic.spec.mjs

permissions:
  contents: read

jobs:
  diagnose-bounding-sphere:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Overlay diagnostic on exact TON-193 head
        shell: bash
        run: |
          set -euo pipefail
          cp .github/temporary/ton193-bounding-sphere-diagnostic.spec.mjs "$RUNNER_TEMP/bounding-sphere-diagnostic.spec.mjs"
          git checkout --detach e4ce181011a2fbe93590d694f59f30e8b4d86202
          cp "$RUNNER_TEMP/bounding-sphere-diagnostic.spec.mjs" tests/e2e/bounding-sphere-diagnostic.spec.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run focused bounding-sphere diagnostic
        run: |
          npm run prepare:ton80-game
          npx playwright test tests/e2e/bounding-sphere-diagnostic.spec.mjs --project=desktop-chromium --reporter=line

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ton193-bounding-sphere-diagnostic
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 1
