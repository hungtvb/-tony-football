name: TON-206 Publish Browser Local Recovery

on:
  pull_request:
    branches:
      - ton206-publish-browser-local-recovery

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ton-206-replay-parity-input-timing
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify browser-local recovery patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton206.patch
          patch -p1 --forward < /tmp/ton206.patch
          git diff --check
          printf '%s  %s\n' '32af1d593e865cbb1387ae692640313a43fca3a25d920d3307f0e5d1182166cb' 'tests/e2e/ton94-p1-continuation.spec.mjs' | sha256sum --check
          node --check tests/e2e/ton94-p1-continuation.spec.mjs

      - name: Commit and push target
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/ton94-p1-continuation.spec.mjs
          git commit -m 'test(ton-206): run recovery in one browser transaction'
          git push origin HEAD:fix/ton-206-replay-parity-input-timing
