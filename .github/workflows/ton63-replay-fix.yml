name: TON-63 snapshot-driven replay fix

on:
  push:
    branches:
      - refactor/ton-63-engine-only-browser-authority

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == '[TON-63] Apply snapshot-driven replay fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ton-63-engine-only-browser-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply replay ownership correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "game.js",
              '''  function updateReplay(dt) {
              if (game.replay.update(dt)) {
                ui.replayBadge.classList.remove("show");
                publishCompatibilityEvent(GameEventType.REPLAY_ENDED);
              }
            }
          ''',
              '''  function updateLegacyReplay(dt) {
              if (game.replay.update(dt)) {
                ui.replayBadge.classList.remove("show");
                publishCompatibilityEvent(GameEventType.REPLAY_ENDED);
              }
            }
          ''',
          )
          replace_once(
              "game.js",
              '''  function updatePresentation(dt) {
              updateInput(); updateParticles(dt); updateReplay(dt); gameFeel.update(dt); game.flash = gameFeel.decayFlash(game.flash,dt); game.shake *= Math.pow(.04, dt);
              game.cameraNotice = Math.max(0, game.cameraNotice - dt);
            }
          ''',
              '''  function updatePresentation(dt) {
              updateInput(); updateParticles(dt); gameFeel.update(dt); game.flash = gameFeel.decayFlash(game.flash,dt); game.shake *= Math.pow(.04, dt);
              game.cameraNotice = Math.max(0, game.cameraNotice - dt);
            }
          ''',
          )
          replace_once(
              "game.js",
              '''  function updateLegacyGameplay(dt) {
              legacyGameplayStepCount += 1;
              updateInput(); updateParticles(dt); updateReplay(dt); gameFeel.update(dt); game.flash = gameFeel.decayFlash(game.flash,dt); game.shake *= Math.pow(.04, dt);
          ''',
              '''  function updateLegacyGameplay(dt) {
              legacyGameplayStepCount += 1;
              updateInput(); updateParticles(dt); updateLegacyReplay(dt); gameFeel.update(dt); game.flash = gameFeel.decayFlash(game.flash,dt); game.shake *= Math.pow(.04, dt);
          ''',
          )

          replace_once(
              "src/game/presentation/SnapshotReplayController.js",
              '''    update(dt) {
              if (!Number.isFinite(dt) || dt < 0) throw new TypeError("replay dt must be a non-negative finite number");
              if (!active) return false;
              elapsed += dt;
              if (elapsed < duration) return false;
              active = false;
              return true;
            },
          ''',
              '''    syncElapsed(nextElapsed) {
              if (!Number.isFinite(nextElapsed) || nextElapsed < 0) {
                throw new TypeError("replay elapsed must be a non-negative finite number");
              }
              if (!active) return false;
              if (nextElapsed < elapsed) throw new RangeError("replay elapsed cannot move backwards");
              if (nextElapsed === elapsed) return false;
              elapsed = nextElapsed;
              return true;
            },

            update(dt) {
              if (!Number.isFinite(dt) || dt < 0) throw new TypeError("replay dt must be a non-negative finite number");
              if (!active) return false;
              elapsed += dt;
              if (elapsed < duration) return false;
              active = false;
              return true;
            },
          ''',
          )

          replace_once(
              "src/game/presentation/CompatibilitySnapshotAdapter.js",
              '''function advanceLiveReplayPlayback(replay, snapshot, previousSnapshot) {
            if (typeof replay?.update !== "function") return false;
            if (!previousSnapshot?.match?.replay?.active) return false;
            const elapsed = snapshot.match.replay?.elapsed ?? 0;
            const previousElapsed = previousSnapshot.match.replay?.elapsed ?? elapsed;
            const deltaSeconds = Math.max(0, elapsed - previousElapsed);
            if (deltaSeconds <= 0) return false;
            return replay.update(deltaSeconds);
          }
          ''',
              '''function syncLiveReplayPlayback(replay, snapshot, previousSnapshot) {
            if (typeof replay?.syncElapsed !== "function") return false;
            if (!snapshot.match.replay?.active || !previousSnapshot?.match?.replay?.active) return false;
            const elapsed = Math.max(0, snapshot.match.replay?.elapsed ?? 0);
            const previousElapsed = Math.max(0, previousSnapshot.match.replay?.elapsed ?? 0);
            if (elapsed <= previousElapsed) return false;
            return replay.syncElapsed(elapsed);
          }
          ''',
          )
          replace_once(
              "src/game/presentation/CompatibilitySnapshotAdapter.js",
              '''  const active = Boolean(snapshot.match.replay?.active);
            const wasActive = Boolean(previousSnapshot?.match?.replay?.active);
            advanceLiveReplayPlayback(replay, snapshot, previousSnapshot);
            if (active && !wasActive && typeof replay.start === "function") {
              replay.start(snapshot);
              return;
            }
            if (!active && wasActive && typeof replay.stop === "function") {
              replay.stop();
              return;
            }

            recordLiveReplayHistory(replay, snapshot, previousSnapshot);
          ''',
              '''  const active = Boolean(snapshot.match.replay?.active);
            const wasActive = Boolean(previousSnapshot?.match?.replay?.active);
            if (active && !wasActive) {
              if (typeof replay.start === "function") replay.start(snapshot);
              const elapsed = Math.max(0, snapshot.match.replay?.elapsed ?? 0);
              if (elapsed > 0 && typeof replay.syncElapsed === "function") replay.syncElapsed(elapsed);
              return;
            }
            if (active && wasActive) {
              syncLiveReplayPlayback(replay, snapshot, previousSnapshot);
              return;
            }
            if (!active && wasActive) {
              if (typeof replay.stop === "function") replay.stop();
              return;
            }

            recordLiveReplayHistory(replay, snapshot, previousSnapshot);
          ''',
          )

          replace_once(
              "tests/tooling/engineModeNoLegacyProgression.test.mjs",
              '''  const [game, bootstrap] = await Promise.all([
              read("game.js"),
              read("src/game/application/BrowserBootstrapComposition.js"),
            ]);
          ''',
              '''  const [game, bootstrap, replayAdapter] = await Promise.all([
              read("game.js"),
              read("src/game/application/BrowserBootstrapComposition.js"),
              read("src/game/presentation/CompatibilitySnapshotAdapter.js"),
            ]);
          ''',
          )
          replace_once(
              "tests/tooling/engineModeNoLegacyProgression.test.mjs",
              '''  assert.match(game, /function updateLegacyGameplay\(dt\)/);
            assert.match(game, /legacyGameplayStepCount \+= 1/);
            assert.doesNotMatch(game, /dispatchCompatibilityCommand:\s*applyCompatibilityCommand/);
          ''',
              '''  const presentation = functionBody(game, "updatePresentation");
            assert.doesNotMatch(presentation, /updateLegacyReplay\(|updateReplay\(/);
            assert.match(game, /function updateLegacyGameplay\(dt\)/);
            assert.match(game, /function updateLegacyReplay\(dt\)/);
            assert.match(game, /legacyGameplayStepCount \+= 1/);
            assert.doesNotMatch(replayAdapter, /replay\.update\(/);
            assert.match(replayAdapter, /replay\.syncElapsed\(/);
            assert.doesNotMatch(game, /dispatchCompatibilityCommand:\s*applyCompatibilityCommand/);
          ''',
          )

          Path("tests/presentation/liveReplayProjection.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";

          import { BrowserRuntimeMode } from "../../src/game/application/BrowserRuntimeComposition.js";
          import { createMatchSnapshot } from "../../src/game/engine/MatchSnapshot.js";
          import { CompatibilitySnapshotAdapter } from "../../src/game/presentation/CompatibilitySnapshotAdapter.js";
          import { createSnapshotReplayController } from "../../src/game/presentation/SnapshotReplayController.js";

          function createLiveSnapshot({ tick, elapsed, replayActive = false, replayElapsed = 0 }) {
            return createMatchSnapshot({
              tick,
              match: {
                state: "playing",
                difficulty: "pro",
                matchSeconds: 150,
                time: Math.max(0, 150 - elapsed),
                elapsed,
                score: [0, 0],
                stats: { possession: [elapsed, 0], shots: [0, 0], passes: 0, completed: 0 },
                selectedPlayerId: "home-4",
                settings: { pitchStyle: "classic", ballStyle: "volt", weather: "clear" },
                replay: { active: replayActive, elapsed: replayElapsed, duration: 3.05 },
                goalSequence: replayActive ? { phase: "replay" } : null,
              },
              players: [
                { id: "home-4", team: 0, index: 4, x: 600 + tick, y: 330, vx: 1, vy: 0 },
                { id: "away-4", team: 1, index: 4, x: 800, y: 370, vx: 0, vy: 0 },
              ],
              ball: {
                id: "match-ball",
                x: 610 + tick,
                y: 330,
                vx: 1,
                vy: 0,
                ownerId: "home-4",
                lastTouchId: "home-4",
                trail: [],
                pendingPass: null,
                possession: { state: "controlled", ownerId: "home-4" },
              },
            });
          }

          function createSource(replay) {
            const home = { team: 0, index: 4 };
            const away = { team: 1, index: 4 };
            return {
              tick: 0,
              state: "playing",
              matchSeconds: 150,
              time: 150,
              difficulty: "pro",
              score: [0, 0],
              stats: { possession: [0, 0], shots: [0, 0], passes: 0, completed: 0 },
              settings: { pitchStyle: "classic", ballStyle: "volt", weather: "clear" },
              replay,
              selectedPlayer: home,
              players: [home, away],
              ball: { x: 610, y: 330, vx: 0, vy: 0, owner: home, lastTouch: home, trail: [], pendingPass: null, possession: {} },
            };
          }

          function createRuntime(snapshots) {
            let index = 0;
            return {
              configure() {},
              advanceToSourceTick(tick) {
                const snapshot = snapshots[index++];
                assert.equal(snapshot.tick, tick);
                return snapshot;
              },
              createRenderFrame() { return null; },
            };
          }

          test("live replay cache follows authoritative elapsed without early visual completion", () => {
            const replay = createSnapshotReplayController({ minimumPlaybackFrames: 1, duration: 3.05 });
            const snapshots = [
              createLiveSnapshot({ tick: 0, elapsed: 0 }),
              createLiveSnapshot({ tick: 1, elapsed: 1 / 15 }),
              createLiveSnapshot({ tick: 2, elapsed: 1 / 15, replayActive: true, replayElapsed: 0 }),
              createLiveSnapshot({ tick: 3, elapsed: 1 / 15, replayActive: true, replayElapsed: 0.5 }),
              createLiveSnapshot({ tick: 4, elapsed: 1 / 15, replayActive: true, replayElapsed: 1 }),
              createLiveSnapshot({ tick: 5, elapsed: 1 / 15, replayActive: true, replayElapsed: 3.05 }),
              createLiveSnapshot({ tick: 6, elapsed: 1 / 15, replayActive: false, replayElapsed: 3.05 }),
            ];
            const source = createSource(replay);
            const adapter = new CompatibilitySnapshotAdapter({
              mode: BrowserRuntimeMode.ENGINE,
              runtimeComposition: createRuntime(snapshots),
            });

            for (const snapshot of snapshots.slice(0, 3)) {
              source.tick = snapshot.tick;
              adapter.capture(source);
            }
            assert.equal(replay.active, true);
            assert.equal(replay.elapsed, 0);

            source.tick = 3;
            adapter.capture(source);
            assert.equal(replay.elapsed, 0.5);

            source.tick = 4;
            adapter.capture(source);
            assert.equal(replay.elapsed, 1);

            source.tick = 5;
            adapter.capture(source);
            assert.equal(replay.elapsed, 3.05);
            assert.equal(replay.active, true);
            assert.ok(replay.currentSnapshot());

            source.tick = 6;
            adapter.capture(source);
            assert.equal(replay.active, false);
            assert.equal(replay.currentSnapshot(), null);
          });

          test("live replay projection advances once per changed engine elapsed and stops once", () => {
            const calls = { start: 0, sync: [], stop: 0 };
            const replay = {
              reset() {},
              record() { return false; },
              start() { calls.start += 1; return true; },
              syncElapsed(value) { calls.sync.push(value); return true; },
              stop() { calls.stop += 1; },
            };
            const snapshots = [
              createLiveSnapshot({ tick: 0, elapsed: 0 }),
              createLiveSnapshot({ tick: 1, elapsed: 0, replayActive: true, replayElapsed: 0 }),
              createLiveSnapshot({ tick: 2, elapsed: 0, replayActive: true, replayElapsed: 0.5 }),
              createLiveSnapshot({ tick: 3, elapsed: 0, replayActive: true, replayElapsed: 0.5 }),
              createLiveSnapshot({ tick: 4, elapsed: 0, replayActive: true, replayElapsed: 1 }),
              createLiveSnapshot({ tick: 5, elapsed: 0, replayActive: false, replayElapsed: 1 }),
              createLiveSnapshot({ tick: 6, elapsed: 0, replayActive: false, replayElapsed: 1 }),
            ];
            const source = createSource(replay);
            const adapter = new CompatibilitySnapshotAdapter({
              mode: BrowserRuntimeMode.ENGINE,
              runtimeComposition: createRuntime(snapshots),
            });

            for (const snapshot of snapshots) {
              source.tick = snapshot.tick;
              adapter.capture(source);
            }

            assert.equal(calls.start, 1);
            assert.deepEqual(calls.sync, [0.5, 1]);
            assert.equal(calls.stop, 1);
          });
          ''')

          replace_once(
              "docs/11_SOURCE_MAP.md",
              '''| `src/game/presentation/CompatibilitySnapshotAdapter.js` | Mirrors immutable live-engine facts into temporary legacy presentation objects or creates isolated read-only compatibility snapshots | Browser mirror writes never become engine inputs; replay history is an outward-only temporary frame cache |''',
              '''| `src/game/presentation/CompatibilitySnapshotAdapter.js` | Mirrors immutable live-engine facts into temporary legacy presentation objects or creates isolated read-only compatibility snapshots | Browser mirror writes never become engine inputs; replay history is outward-only and playback elapsed/start/stop follow authoritative engine snapshots |''',
          )
          replace_once(
              "docs/11_SOURCE_MAP.md",
              '''- `CompatibilitySnapshotAdapter` / `SnapshotReplayController` retain an outward-only replay-frame cache, while engine replay phase/progress is the sole lifecycle clock.''',
              '''- `CompatibilitySnapshotAdapter` / `SnapshotReplayController` retain an outward-only replay-frame cache. The adapter synchronizes playback elapsed from authoritative engine snapshots, starts on `replay.active` false→true and stops only on true→false; the browser fixed step never advances or ends replay.''',
          )
          PY
      - name: Validate focused replay ownership
        run: |
          npm ci
          node --check game.js
          node --check src/game/presentation/CompatibilitySnapshotAdapter.js
          node --check src/game/presentation/SnapshotReplayController.js
          node --test tests/presentation/snapshotReplayController.test.mjs tests/presentation/liveReplayProjection.test.mjs tests/tooling/engineModeNoLegacyProgression.test.mjs
          npm run test:ci:fast
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ton63-replay-fix.yml
          git add game.js src/game/presentation/CompatibilitySnapshotAdapter.js src/game/presentation/SnapshotReplayController.js tests/tooling/engineModeNoLegacyProgression.test.mjs tests/presentation/liveReplayProjection.test.mjs docs/11_SOURCE_MAP.md
          git commit -m "[TON-63] Make replay playback snapshot-driven"
          git push