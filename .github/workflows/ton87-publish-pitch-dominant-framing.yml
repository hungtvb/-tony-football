name: TON-87 Publish Pitch Dominant Framing

on:
  pull_request:
    branches:
      - ton87-publish-pitch-dominant-framing
    paths:
      - .github/ton87-pitch-dominant-framing-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Apply reviewed framing patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          expected_head='dd05a128cbcd5fde5cd9a8960339f7107989aa65'
          test "$(git rev-parse HEAD)" = "$expected_head"
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton87-framing.patch
          git apply --check /tmp/ton87-framing.patch
          git apply /tmp/ton87-framing.patch
          git diff --check
          expected_files="$(printf '%s\n' \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            game.js \
            scripts/ton-80-migrate-game.py \
            src/game/presentation/BrowserThreeSceneEnvironmentHost.js \
            src/game/presentation/ThreeSceneEnvironmentProfile.js \
            tests/e2e/model-views.spec.mjs \
            tests/presentation/browserThreeSceneEnvironmentHostLifecycle.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"

      - name: Verify exact corrected branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast

      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'dd05a128cbcd5fde5cd9a8960339f7107989aa65'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            game.js \
            scripts/ton-80-migrate-game.py \
            src/game/presentation/BrowserThreeSceneEnvironmentHost.js \
            src/game/presentation/ThreeSceneEnvironmentProfile.js \
            tests/e2e/model-views.spec.mjs \
            tests/presentation/browserThreeSceneEnvironmentHostLifecycle.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs
          git commit -m 'fix(ton-87): make pitch dominant in stadium framing'
          git push origin HEAD:feat/ton-87-world-scale-contract
