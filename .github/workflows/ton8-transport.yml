name: TON-8 Patch Transport

on:
  push:
    branches:
      - fix/ton-8-safe-bootstrap

permissions:
  contents: write

jobs:
  apply-validated-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ton-8-safe-bootstrap
          fetch-depth: 1

      - name: Apply locally validated TON-8 patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/ton8.patch
          git apply --check /tmp/ton8.patch
          git apply /tmp/ton8.patch
          rm .github/workflows/ton8-transport.yml
          git config user.name 'Tony Dev'
          git config user.email 'tony-dev@users.noreply.github.com'
          git add -A
          git commit -m 'fix(tooling): protect active local workspaces'
          git push origin HEAD:fix/ton-8-safe-bootstrap
