name: Local Playwright Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/local-playwright-runtime.yml"

permissions:
  contents: read

jobs:
  package-runtime:
    name: Package local runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Package source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > .local-runtime-sha
          tar \
            --exclude=.git \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/tony-local-playwright-runtime.tgz .
          tar -czf /tmp/tony-playwright-browsers.tgz -C "$HOME/.cache" ms-playwright

      - name: Upload local runtime
        uses: actions/upload-artifact@v4
        with:
          name: tony-local-playwright-runtime
          path: /tmp/tony-local-playwright-runtime.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Playwright browsers
        uses: actions/upload-artifact@v4
        with:
          name: tony-playwright-browsers
          path: /tmp/tony-playwright-browsers.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
