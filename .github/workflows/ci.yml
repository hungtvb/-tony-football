name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-ton63-replay-fix:
    name: Apply TON-63 replay correction
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/ton-63-engine-only-browser-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply and validate correction
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/ton63-replay-fix.py
            python scripts/ton63-replay-contract-fix.py
            npm ci
            node --check game.js
            node --check src/game/presentation/CompatibilitySnapshotAdapter.js
            node --check src/game/presentation/SnapshotReplayController.js
            node --test tests/presentation/snapshotReplayController.test.mjs tests/presentation/liveReplayProjection.test.mjs tests/presentation/liveReplayCompatibilityProjection.test.mjs tests/presentation/snapshotPresentationRuntime.test.mjs tests/tooling/engineModeNoLegacyProgression.test.mjs
            npm run test:ci:fast
          } 2>&1 | tee ton63-correction.log
      - name: Upload correction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ton63-correction-diagnostics
          path: ton63-correction.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit corrected exact head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/ton63-replay-fix.yml scripts/ton63-replay-fix.py scripts/ton63-replay-contract-fix.py
          git add game.js src/game/presentation/CompatibilitySnapshotAdapter.js src/game/presentation/SnapshotReplayController.js tests/tooling/engineModeNoLegacyProgression.test.mjs tests/presentation/liveReplayProjection.test.mjs tests/presentation/liveReplayCompatibilityProjection.test.mjs tests/presentation/snapshotPresentationRuntime.test.mjs docs/11_SOURCE_MAP.md
          git commit -m "[TON-63] Make replay playback snapshot-driven"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  fast-validation:
    name: Unit and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run browser-free validation
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci:fast 2>&1 | tee fast-test.log
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-evidence
          path: fast-test.log
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: Browser composition smoke
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run minimal browser smoke
        run: npm run test:e2e:smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - fast-validation
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.fast-validation.result }}" = "success"
          test "${{ needs.browser-smoke.result }}" = "success"
