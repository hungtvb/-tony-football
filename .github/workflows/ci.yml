name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/u3-2-match-flow
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded U3.2 match flow integration
        run: |
          if ! grep -q 'showMatchSetup' game.js; then
            node scripts/apply-u3-2-match-flow.mjs
          fi
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run unit test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - name: Run browser validation
        run: npm run test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u3-2-test-evidence
          path: |
            unit-test.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit integrated match flow
        run: |
          if ! git diff --quiet -- game.js index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js index.html
            git commit -m "feat(u3.2): add pause navigation and setup return flow"
            git push origin HEAD:feature/u3-2-match-flow
          fi
