name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/g3-ball-control-first-touch
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded G3 first-touch runtime integration
        run: |
          if ! grep -q 'resolveFirstTouch' game.js; then
            node scripts/apply-g3-first-touch-runtime.mjs
          fi
      - name: Run test suite
        run: npm test
      - name: Commit integrated first-touch runtime
        run: |
          if ! git diff --quiet -- game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js
            git commit -m "feat(g3): enable first-touch outcomes [g3-first-touch-integrated]"
            git push origin HEAD:feature/g3-ball-control-first-touch
          fi
