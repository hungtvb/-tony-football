name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Unit and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run browser-free validation
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci:fast 2>&1 | tee fast-test.log
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-test-evidence
          path: fast-test.log
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: Browser composition smoke
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run core browser smoke
        run: npm run test:e2e:smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  asset-smoke:
    name: Real asset appearance smoke
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run normal asset-mode proof
        run: npm run test:e2e:asset-smoke
      - name: Upload asset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-smoke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  golden-match:
    name: Golden match lifecycle
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run natural goal and Canvas lifecycle
        run: npm run test:e2e:golden
      - name: Upload golden-match evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-match-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  p1-parity:
    name: TON-94 P1 browser parity
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run P1 parity chronology
        run: npm run test:e2e:p1-parity
      - name: Upload P1 parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ton94-p1-parity-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - fast-validation
      - browser-smoke
      - asset-smoke
      - golden-match
      - p1-parity
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.fast-validation.result }}" = "success"
          test "${{ needs.browser-smoke.result }}" = "success"
          test "${{ needs.asset-smoke.result }}" = "success"
          test "${{ needs.golden-match.result }}" = "success"
          test "${{ needs.p1-parity.result }}" = "success"
