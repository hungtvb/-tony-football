name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check game.js && node --check server.mjs
      - name: Validate assets and UI contract
        run: node scripts/validate-assets.mjs
      - name: Run simulation tests
        run: node --test tests/simulation/*.test.mjs
      - name: Run existing presentation tests
        run: node --test tests/presentation/AudioFeedbackController.test.mjs tests/presentation/ContextualParticlePolicy.test.mjs tests/presentation/game-feel-controller.test.mjs tests/presentation/game-feel-visuals.test.mjs
      - name: Run U2 runtime regression tests
        run: node --test tests/presentation/u2-runtime-regressions.test.mjs
