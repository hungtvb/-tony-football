name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/g2-player-movement
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded G2 AI locomotion integration
        run: |
          if grep -q 'function moveToward(player, tx, ty, speed, dt)' game.js && ! grep -q 'stepTowardTarget' game.js; then
            node scripts/apply-g2-ai-locomotion.mjs
          fi
      - name: Verify AI arrival behavior
        run: node --test --test-name-pattern="AI target locomotion preserves" tests/gameplay/PlayerLocomotion.test.mjs
      - name: Verify AI arrival damping
        run: node --test --test-name-pattern="AI target locomotion damps" tests/gameplay/PlayerLocomotion.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Commit integrated AI locomotion
        run: |
          if ! git diff --quiet -- game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js
            git commit -m "refactor(g2): integrate shared AI locomotion [g2-ai-integrated]"
            git push origin HEAD:feature/g2-player-movement
          fi
