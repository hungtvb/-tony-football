name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ui-u2-game-feel
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pending U2 review fixes
        run: |
          if grep -q 'audioContext?.currentTime ?? performance.now() / 1000' game.js; then
            node scripts/apply-u2-review-fixes.mjs
          fi
      - name: Commit applied review fixes
        run: |
          if ! git diff --quiet -- game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js
            git commit -m "fix(u2): resolve reviewed runtime regressions [u2-review-fixed]"
            git push origin HEAD:feature/ui-u2-game-feel
          fi
      - name: Run test suite
        run: npm test
