name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/g2-player-movement
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded G2 tuning and orientation integration
        run: |
          if ! grep -q 'chooseSprintTransitionResponse' game.js; then
            node scripts/apply-g2-tuning-orientation.mjs
          fi
      - name: Run test suite
        run: npm test
      - name: Commit integrated tuning
        run: |
          if ! git diff --quiet -- game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game.js
            git commit -m "tune(g2): refine sprint transitions and renderer heading [g2-tuned]"
            git push origin HEAD:feature/g2-player-movement
          fi