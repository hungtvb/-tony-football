name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Unit and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run browser-free validation
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci:fast 2>&1 | tee fast-test.log
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-evidence
          path: fast-test.log
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: Browser composition smoke
    needs:
      - fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run minimal browser smoke
        run: npm run test:e2e:smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - fast-validation
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.fast-validation.result }}" = "success"
          test "${{ needs.browser-smoke.result }}" = "success"
