name: TON-63 authority fix

on:
  push:
    branches:
      - refactor/ton-63-engine-only-browser-authority

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ton63-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ton-63-engine-only-browser-authority
          fetch-depth: 0
      - name: Apply authority correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "game.js",
              "  let recordReplaySnapshot = false;\n",
              "  let recordReplaySnapshot = false;\n  let legacyGameplayStepCount = 0;\n",
          )
          replace_once(
              "game.js",
              "  function update(dt) {\n",
              "  function updatePresentation(dt) {\n"
              "    updateInput(); updateParticles(dt); updateReplay(dt); gameFeel.update(dt); game.flash = gameFeel.decayFlash(game.flash,dt); game.shake *= Math.pow(.04, dt);\n"
              "    game.cameraNotice = Math.max(0, game.cameraNotice - dt);\n"
              "  }\n\n"
              "  function updateLegacyGameplay(dt) {\n"
              "    legacyGameplayStepCount += 1;\n",
          )
          replace_once(
              "game.js",
              "    update(dt);\n",
              "    updatePresentation(dt);\n",
          )
          replace_once(
              "game.js",
              "    dispatchCompatibilityCommand: applyCompatibilityCommand,\n",
              "",
          )
          replace_once(
              "game.js",
              "      visualTestMode,\n",
              "      visualTestMode,\n      legacyGameplayStepCount,\n",
          )
          replace_once(
              "game.js",
              "  function applyCompatibilityCommand(command) {\n",
              "  // Isolated legacy migration helper. Deployed browser composition never references it.\n  function applyCompatibilityCommand(command) {\n",
          )

          replace_once(
              "src/game/application/BrowserBootstrapComposition.js",
              "    dispatchCompatibilityCommand,\n",
              "",
          )
          replace_once(
              "src/game/application/BrowserBootstrapComposition.js",
              "    if (typeof dispatchCompatibilityCommand !== \"function\") {\n      throw new TypeError(\"Browser bootstrap requires a compatibility command boundary\");\n    }\n",
              "",
          )
          replace_once(
              "src/game/application/BrowserBootstrapComposition.js",
              "      dispatchGameCommand: dispatchCompatibilityCommand,\n",
              "",
          )
          replace_once(
              "src/game/application/BrowserBootstrapComposition.js",
              "      onCommand: dispatchCompatibilityCommand,\n",
              "      onCommand: () => {\n        throw new Error(\"browser input cannot dispatch compatibility gameplay commands\");\n      },\n",
          )

          replace_once(
              "tests/e2e/smoke.spec.mjs",
              "  expect(boot.runtimeMode).toBe(\"engine\");\n",
              "  expect(boot.runtimeMode).toBe(\"engine\");\n  expect(boot.legacyGameplayStepCount).toBe(0);\n",
          )
          replace_once(
              "tests/e2e/smoke.spec.mjs",
              "  expect(runtimeErrors).toEqual([]);\n});\n\ntest(\"Canvas fallback",
              "  expect(await page.evaluate(() => window.__TONY_DEBUG__.diagnostics().legacyGameplayStepCount)).toBe(0);\n  expect(runtimeErrors).toEqual([]);\n});\n\ntest(\"Canvas fallback",
          )

          Path("tests/tooling/engineModeNoLegacyProgression.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst rootUrl = new URL("../../", import.meta.url);\n\nasync function read(path) {\n  return readFile(new URL(path, rootUrl), "utf8");\n}\n\nfunction functionBody(source, name) {\n  const signature = `function ${name}(`;\n  const start = source.indexOf(signature);\n  assert.notEqual(start, -1, `${name} must exist`);\n  const open = source.indexOf("{", start);\n  let depth = 0;\n  for (let index = open; index < source.length; index += 1) {\n    if (source[index] === "{") depth += 1;\n    if (source[index] === "}") depth -= 1;\n    if (depth === 0) return source.slice(open + 1, index);\n  }\n  assert.fail(`${name} body is not balanced`);\n}\n\ntest("engine browser step never invokes legacy gameplay progression", async () => {\n  const [game, bootstrap] = await Promise.all([\n    read("game.js"),\n    read("src/game/application/BrowserBootstrapComposition.js"),\n  ]);\n\n  const step = functionBody(game, "simulationStep");\n  assert.match(step, /updatePresentation\(dt\)/);\n  assert.doesNotMatch(step, /updateLegacyGameplay\(|(?:^|\\s)update\(dt\)/);\n  assert.match(game, /function updateLegacyGameplay\(dt\)/);\n  assert.match(game, /legacyGameplayStepCount \+= 1/);\n  assert.doesNotMatch(game, /dispatchCompatibilityCommand:\s*applyCompatibilityCommand/);\n  assert.doesNotMatch(bootstrap, /dispatchCompatibilityCommand/);\n  assert.match(bootstrap, /browser input cannot dispatch compatibility gameplay commands/);\n});\n''')

          replace_once(
              "docs/11_SOURCE_MAP.md",
              "| `game.js` | Render implementations, DOM callbacks, settings/effects and temporary snapshot-projected legacy objects | Legacy gameplay functions are dormant in deployed browser flow; they cannot receive lifecycle commands or be activated by URL/debug parameters |",
              "| `game.js` | Render implementations, DOM callbacks, settings/effects, presentation-only fixed-step decay and temporary snapshot-projected legacy objects | Deployed `simulationStep` invokes only presentation updates and engine snapshot capture; isolated legacy gameplay helpers have a zero-invocation browser guard |",
          )
          replace_once(
              "docs/11_SOURCE_MAP.md",
              "| `src/game/input/BrowserInputAdapter.js` | FO4 key lifecycle, immutable human commands and transient attack-intent signaling | Sends commands to live runtime; callback injection is test/transport-only and does not advance gameplay |",
              "| `src/game/input/BrowserInputAdapter.js` | FO4 key lifecycle, immutable human commands and transient attack-intent signaling | Deployed bootstrap dispatches only to the live runtime and fails closed if authority is unavailable; callback injection remains isolated from production composition |",
          )
          replace_once(
              "docs/11_SOURCE_MAP.md",
              "`game.js` are temporary presentation mirrors only: lifecycle commands cannot reach\ntheir simulator, debug URL parameters are removed before module load, and direct\nmirror writes are overwritten by the next immutable engine snapshot without changing\nengine-owned state.",
              "`game.js` are temporary presentation mirrors only: deployed fixed steps call the\npresentation-only update path and never invoke legacy AI, physics, rules, clock or\nlifecycle progression. Debug URL parameters are removed before module load, input\nfails closed outside engine authority, and direct mirror writes are overwritten by the\nnext immutable engine snapshot without changing engine-owned state.",
          )
          replace_once(
              "docs/11_SOURCE_MAP.md",
              "- `game.js` still contains dormant compatibility implementation functions because renderer, DOM, settings and debug extraction belongs to TON-64; deployed browser flow cannot activate them as gameplay authority.",
              "- `game.js` still contains isolated legacy implementation helpers because renderer, DOM and settings extraction belongs to TON-64; deployed fixed steps have a tested zero-invocation boundary for those helpers.",
          )
          PY
      - name: Validate changed JavaScript
        run: |
          node --check game.js
          node --check src/game/application/BrowserBootstrapComposition.js
          node --check tests/tooling/engineModeNoLegacyProgression.test.mjs
          node --test tests/tooling/engineModeNoLegacyProgression.test.mjs
      - name: Commit authority correction
        run: |
          git config user.name "tony-football-dev"
          git config user.email "actions@users.noreply.github.com"
          git add game.js src/game/application/BrowserBootstrapComposition.js tests/e2e/smoke.spec.mjs tests/tooling/engineModeNoLegacyProgression.test.mjs docs/11_SOURCE_MAP.md
          git commit -m "[ton63-fix] stop deployed legacy gameplay progression"
          git push origin HEAD:refactor/ton-63-engine-only-browser-authority
