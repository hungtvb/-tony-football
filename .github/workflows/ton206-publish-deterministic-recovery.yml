name: TON-206 Publish Deterministic Recovery

on:
  pull_request:
    branches:
      - ton206-publish-deterministic-recovery

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ton-206-replay-parity-input-timing
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify deterministic recovery patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton206.patch
          patch -p1 --forward < /tmp/ton206.patch
          git diff --check
          printf '%s  %s\n' 'a6492dd327d9155aad307f38aac402535dd8cf8d5337a58f24c556bfff1ac4df' 'tests/e2e/ton94-p1-continuation.spec.mjs' | sha256sum --check
          node --check tests/e2e/ton94-p1-continuation.spec.mjs

      - name: Commit and push target
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/ton94-p1-continuation.spec.mjs
          git commit -m 'test(ton-206): drive recovery by simulation ticks'
          git push origin HEAD:fix/ton-206-replay-parity-input-timing
