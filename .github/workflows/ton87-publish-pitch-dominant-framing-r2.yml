name: TON-87 Publish Pitch Dominant Framing R2

on:
  pull_request:
    branches:
      - ton87-publish-pitch-dominant-framing-r2
    paths:
      - .github/ton87-pitch-dominant-framing-r2-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Apply pitch-dominant framing patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          expected_head='dd05a128cbcd5fde5cd9a8960339f7107989aa65'
          test "$(git rev-parse HEAD)" = "$expected_head"
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton87-framing.patch
          git apply --check /tmp/ton87-framing.patch
          git apply /tmp/ton87-framing.patch
          git diff --check
          expected_files="$(printf '%s\n' \
            game.js \
            scripts/ton-80-migrate-game.py \
            src/game/config/cameraHudConfig.js \
            src/game/presentation/BrowserThreeSceneEnvironmentHost.js \
            src/game/presentation/ThreeSceneEnvironmentProfile.js \
            tests/e2e/model-views.spec.mjs \
            tests/presentation/cameraHudRuntime.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"
          printf '%s  %s\n' \
            '20918381437ada04f3b4602db018801f4a821230e26f37fe93f5f8d8d1b9ba23' game.js \
            '486549b3f7f1c0ab6e28016f36decf448361a2c63a28515e33b0954daeb284ac' scripts/ton-80-migrate-game.py \
            '3045fd70f23bb8814bdaddfb84dab61ad8ae040300ca6c23b755e3ee81d81cca' src/game/config/cameraHudConfig.js \
            '3f3ba063daa4e774a56f4096a67ce88f1c8f34f833a1f4a870e8b05c911270ee' src/game/presentation/BrowserThreeSceneEnvironmentHost.js \
            '0f34e8ce408dabdd518189c72e6a0615a21a2d3fb78d639585e3ff8345484d6a' src/game/presentation/ThreeSceneEnvironmentProfile.js \
            'e83526fbbd9b2fb4347663681eb7dd26a5f3890239f43f378594e65e505bdb59' tests/e2e/model-views.spec.mjs \
            '7f6599dc542c4552d7c8a198fdd938265c230016ce71e09272f72556c444c4de' tests/presentation/cameraHudRuntime.test.mjs \
            'a3ef288ce6e1b81c6f3ab794e021b8e43eee26656610285bf795caf7dcd227b0' tests/presentation/threeSceneEnvironmentProfile.test.mjs | sha256sum --check

      - name: Verify corrected branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast

      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'dd05a128cbcd5fde5cd9a8960339f7107989aa65'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            game.js \
            scripts/ton-80-migrate-game.py \
            src/game/config/cameraHudConfig.js \
            src/game/presentation/BrowserThreeSceneEnvironmentHost.js \
            src/game/presentation/ThreeSceneEnvironmentProfile.js \
            tests/e2e/model-views.spec.mjs \
            tests/presentation/cameraHudRuntime.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs
          git commit -m 'fix(ton-87): make pitch dominant in match framing'
          git push origin HEAD:feat/ton-87-world-scale-contract
