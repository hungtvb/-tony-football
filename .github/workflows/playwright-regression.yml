name: Playwright Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: playwright-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broad-browser-regression:
    name: Broad ${{ matrix.project }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - narrow-landscape
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run broad browser regression
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload broad evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.project }}-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
