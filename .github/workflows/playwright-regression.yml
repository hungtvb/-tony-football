name: Playwright Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: playwright-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broad-browser-regression:
    name: Broad ${{ matrix.project }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - narrow-landscape
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run broad browser regression
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload broad evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
