name: Apply U2 WebGL ball trail

on:
  push:
    branches:
      - feature/ui-u2-game-feel
    paths:
      - scripts/apply-u2-webgl-trail.mjs
      - .github/workflows/apply-u2-webgl-trail.yml

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[u2-webgl-trail-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-u2-game-feel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded migration
        run: node scripts/apply-u2-webgl-trail.mjs
      - name: Run full test suite
        run: npm test
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "feat(game-feel): integrate WebGL ball trail [u2-webgl-trail-applied]"
          git push origin HEAD:feature/ui-u2-game-feel
