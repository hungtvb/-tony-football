name: ChatGPT Source Export Framing

on:
  pull_request:
    branches:
      - feat/ton-87-world-scale-contract
    paths:
      - .github/workflows/chatgpt-source-export-framing.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact PR base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tony-football-ton87-framing-with-git.tar.gz"
          tar -C "$GITHUB_WORKSPACE" -czf "$archive" .
          test -s "$archive"
          cd "$RUNNER_TEMP"
          sha256sum -- "$(basename "$archive")" > "$(basename "$archive").sha256"
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: tony-football-ton87-framing-with-git
          path: |
            ${{ runner.temp }}/tony-football-ton87-framing-with-git.tar.gz
            ${{ runner.temp }}/tony-football-ton87-framing-with-git.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
