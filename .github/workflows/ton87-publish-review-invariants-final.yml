name: TON-87 Publish Final Reviewer Invariants

on:
  pull_request:
    branches:
      - ton87-publish-review-contract-fixes
    paths:
      - .github/ton87-review-invariants-final-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product

      - name: Check out correction payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ton87-publish-review-contract-fixes
          fetch-depth: 1
          persist-credentials: false
          path: payload

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Apply final reviewer invariants
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          expected_head='477f1e78033010e95ebe44e41167fcd9d908ddb6'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git apply --check ../payload/.github/ton87-review-invariants-final.patch
          git apply ../payload/.github/ton87-review-invariants-final.patch
          git diff --check

          expected_files="$(printf '%s\n' \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            src/game/config/simulationScaleProfile.js \
            src/game/engine/MatchEngine.js \
            src/game/engine/MatchState.js \
            src/game/engine/PlayerMovementSystem.js \
            tests/engine/SimulationScaleProfile.test.mjs \
            tests/engine/WorldScaleContract.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"

      - name: Verify final exact branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast

      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '477f1e78033010e95ebe44e41167fcd9d908ddb6'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            src/game/config/simulationScaleProfile.js \
            src/game/engine/MatchEngine.js \
            src/game/engine/MatchState.js \
            src/game/engine/PlayerMovementSystem.js \
            tests/engine/SimulationScaleProfile.test.mjs \
            tests/engine/WorldScaleContract.test.mjs
          git commit -m 'fix(ton-87): make profile geometry invariants explicit'
          git push origin HEAD:feat/ton-87-world-scale-contract
