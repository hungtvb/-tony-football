name: TON-87 Publish Centered Tactical R4

on:
  pull_request:
    branches:
      - ton87-publish-centered-tactical-r4
    paths:
      - .github/ton87-centered-tactical-r4-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Apply verified centered tactical patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '74d277fc1cd3a39795b7c866f15e2f41d738c3e7'
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton87-tactical-center.patch
          git apply --check /tmp/ton87-tactical-center.patch
          git apply /tmp/ton87-tactical-center.patch
          git diff --check
          expected_files="$(printf '%s\n' game.js scripts/ton-80-migrate-game.py src/game/config/cameraHudConfig.js tests/e2e/model-views.spec.mjs tests/presentation/cameraHudRuntime.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"
          printf '%s  %s\n' \
            '2fd137d87f684d0c4daabb33a40aad1efd0b44a2fc30a872d9a2f335b7aff610' game.js \
            '75bc7478c5cd383f70db9b833b6275737b4c4d76373bde551743508c2aa65d34' scripts/ton-80-migrate-game.py \
            'd0cbcc19f4524e9b0c19f26861db947d4fdf51a424098c84893d9511b7d3e6ce' src/game/config/cameraHudConfig.js \
            'a598797708f6defa2a1c2f050e9c535f3f84bdc5a59a2bb0cc69811073fb08f0' tests/e2e/model-views.spec.mjs \
            '8dc9ec2428651e7d8db3456ecd262ee8284fe7c044794e54109c0bdbb447678c' tests/presentation/cameraHudRuntime.test.mjs | sha256sum --check
      - name: Verify corrected branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast
      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '74d277fc1cd3a39795b7c866f15e2f41d738c3e7'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add game.js scripts/ton-80-migrate-game.py src/game/config/cameraHudConfig.js tests/e2e/model-views.spec.mjs tests/presentation/cameraHudRuntime.test.mjs
          git commit -m 'fix(ton-87): keep tactical pitch centered and fully visible'
          git push origin HEAD:feat/ton-87-world-scale-contract
