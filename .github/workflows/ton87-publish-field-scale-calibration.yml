name: TON-87 Publish Field Scale Calibration

on:
  pull_request:
    branches:
      - ton87-publish-field-scale-calibration
    paths:
      - .github/ton87-field-scale-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product

      - name: Check out reviewed payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ton87-publish-field-scale-calibration
          fetch-depth: 1
          persist-credentials: false
          path: payload

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Apply field scale calibration
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          expected_head='cb45e6811c6149ed86fb6c9cd5dfbac3ed9fffd1'
          test "$(git rev-parse HEAD)" = "$expected_head"
          for patch in \
            ton87-field-profile.patch \
            ton87-field-runtime.patch \
            ton87-field-tests.patch \
            ton87-field-docs.patch
          do
            git apply --check "../payload/.github/$patch"
            git apply "../payload/.github/$patch"
          done
          git diff --check

          expected_files="$(printf '%s\n' \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            game.js \
            src/game/config/simulationScaleProfile.js \
            src/game/engine/MatchState.js \
            src/game/presentation/RadarSnapshotAdapter.js \
            tests/e2e/engine-runtime-harness.mjs \
            tests/engine/EngineSimulation.test.mjs \
            tests/engine/SimulationScaleProfile.test.mjs \
            tests/engine/WorldScaleContract.test.mjs \
            tests/presentation/radarSnapshotAdapter.test.mjs \
            tests/presentation/radarSnapshotRenderer.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"

      - name: Verify calibrated exact branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast

      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'cb45e6811c6149ed86fb6c9cd5dfbac3ed9fffd1'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/20_WORLD_SCALE_CONTRACT.md \
            docs/adr/ADR-005-METRIC-MINI-6V6-WORLD-SCALE.md \
            game.js \
            src/game/config/simulationScaleProfile.js \
            src/game/engine/MatchState.js \
            src/game/presentation/RadarSnapshotAdapter.js \
            tests/e2e/engine-runtime-harness.mjs \
            tests/engine/EngineSimulation.test.mjs \
            tests/engine/SimulationScaleProfile.test.mjs \
            tests/engine/WorldScaleContract.test.mjs \
            tests/presentation/radarSnapshotAdapter.test.mjs \
            tests/presentation/radarSnapshotRenderer.test.mjs \
            tests/presentation/threeSceneEnvironmentProfile.test.mjs
          git commit -m 'fix(ton-87): calibrate compact 6v6 field scale'
          git push origin HEAD:feat/ton-87-world-scale-contract
