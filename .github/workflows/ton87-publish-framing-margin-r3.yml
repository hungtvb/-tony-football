name: TON-87 Publish Framing Margin R3

on:
  pull_request:
    branches:
      - ton87-publish-framing-margin-r3
    paths:
      - .github/ton87-framing-margin-r3-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ton-87-world-scale-contract
          fetch-depth: 0
          path: product
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Apply verified framing margin patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '36d47c51a1508a98bfa4c7998ce743c061d82c5d'
          printf '%s' '' | base64 -d | gzip -d > /tmp/ton87-framing-r3.patch
          git apply --check /tmp/ton87-framing-r3.patch
          git apply /tmp/ton87-framing-r3.patch
          git diff --check
          expected_files="$(printf '%s\n' src/game/config/cameraHudConfig.js src/game/presentation/ThreeSceneEnvironmentProfile.js tests/e2e/model-views.spec.mjs tests/presentation/cameraHudRuntime.test.mjs tests/presentation/threeSceneEnvironmentProfile.test.mjs | sort)"
          actual_files="$(git status --porcelain | cut -c4- | sort)"
          test "$actual_files" = "$expected_files"
          printf '%s  %s\n' \
            'bb9d2e32e3306c39a921158e90538178da6aab3467ddef32b7fb54215b7c785f' src/game/config/cameraHudConfig.js \
            'b8d1b46b06b89fe3685e0e432c6dc3ae26ef022b461ccad32fc68473d5170ade' src/game/presentation/ThreeSceneEnvironmentProfile.js \
            'dde0a1528071ea8d378efad7ea4312ed85dc0d9cacd168eda923ff536f1123ea' tests/e2e/model-views.spec.mjs \
            'eceb3b43fb2c992b43c823cda9ca6e2b73a88228c27c5b5358f3c4f1ccc6ea73' tests/presentation/cameraHudRuntime.test.mjs \
            '1519a91898e86d56e3bc242e03a489b4e10128193cf30d83d271d419fd83518d' tests/presentation/threeSceneEnvironmentProfile.test.mjs | sha256sum --check
      - name: Verify corrected branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ci:fast
      - name: Commit and push product branch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '36d47c51a1508a98bfa4c7998ce743c061d82c5d'
          git config user.name 'tony-football-reviewer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/game/config/cameraHudConfig.js src/game/presentation/ThreeSceneEnvironmentProfile.js tests/e2e/model-views.spec.mjs tests/presentation/cameraHudRuntime.test.mjs tests/presentation/threeSceneEnvironmentProfile.test.mjs
          git commit -m 'fix(ton-87): add framing margin and preserve failed evidence'
          git push origin HEAD:feat/ton-87-world-scale-contract
