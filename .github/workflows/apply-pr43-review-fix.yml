name: Apply PR 43 local review fix

on:
  push:
    branches:
      - feature/r1-engine-boundary

permissions:
  contents: write

jobs:
  apply:
    name: Apply locally validated patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and clean temporary transport
        shell: bash
        run: |
          set -euo pipefail
          parts=(.local-runtime/pr43-review.patch.part-*)
          test -f "${parts[0]}"
          cat "${parts[@]}" > /tmp/pr43-review.patch
          git apply --check /tmp/pr43-review.patch
          git apply /tmp/pr43-review.patch
          rm -f "${parts[@]}"
          rmdir .local-runtime 2>/dev/null || true
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-pr43-review-fix.yml
          git config user.name "Tony Dev"
          git config user.email "tony-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(presentation): align engine feedback contracts"
          git push origin HEAD:feature/r1-engine-boundary
